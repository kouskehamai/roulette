<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カスタムルーレット</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin-top: 50px;
            color: #333;
        }
        .roulette {
            font-size: 80px;
            font-weight: bold;
            color: #ff6347;
            margin: 30px auto;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-container {
            margin: 20px;
        }
        input {
            font-size: 18px;
            padding: 5px;
        }
        .list {
            margin: 20px;
            font-size: 18px;
            color: #333;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .list span {
            display: flex;
            align-items: center;
            background-color: #eee;
            padding: 5px 10px;
            border-radius: 5px;
            position: relative;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .list span button {
            background: #ccc;
            color: #333;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .list span button:hover {
            background: #bbb;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>カスタムルーレット</h1>
    <div class="input-container">
        <input type="text" id="valueInput" placeholder="値を入力">
        <button id="addButton">追加</button>
    </div>
    <div class="list" id="valueList">選択された値: なし</div>
    <div class="roulette" id="roulette">-</div>
    <button id="startButton" disabled>スタート</button>
    <button id="stopButton" disabled>ストップ</button>

    <script>
        const valueInput = document.getElementById("valueInput");
        const addButton = document.getElementById("addButton");
        const valueList = document.getElementById("valueList");
        const rouletteElement = document.getElementById("roulette");
        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");

        let values = []; // ユーザーが追加した値を保持する配列
        let interval;

        // 値をリストに追加する関数
        function addValue() {
            const value = valueInput.value.trim(); // 入力値をトリム（前後の空白を削除）

            if (value === "") {
                alert("空の値は追加できません");
                return;
            }

            if (values.includes(value)) {
                alert("同じ値は追加できません");
                return;
            }

            values.push(value);
            updateValueList();
            valueInput.value = ""; // 入力フィールドをリセット
            startButton.disabled = values.length === 0; // スタートボタンの有効化
        }

        // 値リストを更新する関数
        function updateValueList() {
            valueList.innerHTML = ""; // リストを初期化

            if (values.length === 0) {
                valueList.textContent = "選択された値: なし";
                startButton.disabled = true;
                return;
            }

            valueList.textContent = "選択された値: ";
            values.forEach((val, index) => {
                const span = document.createElement("span");
                span.textContent = val;

                // 削除ボタン
                const deleteButton = document.createElement("button");
                deleteButton.textContent = "×";
                deleteButton.addEventListener("click", () => removeValue(index));

                span.prepend(deleteButton); // ボタンを値の前に配置
                valueList.appendChild(span);
            });
        }

        // 値を削除する関数
        function removeValue(index) {
            values.splice(index, 1); // 指定されたインデックスの値を削除
            updateValueList(); // リストを更新
        }

        // ルーレットをスタートする関数
        function startRoulette() {
            startButton.disabled = true;
            stopButton.disabled = false;

            interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * values.length);
                rouletteElement.textContent = values[randomIndex];
            }, 100); // 0.1秒ごとに更新
        }

        // ルーレットをストップする関数
        function stopRoulette() {
            clearInterval(interval);
            startButton.disabled = false;
            stopButton.disabled = true;
        }

        // ボタンのイベントリスナーを設定
        addButton.addEventListener("click", addValue);
        startButton.addEventListener("click", startRoulette);
        stopButton.addEventListener("click", stopRoulette);
    </script>
</body>
</html>
